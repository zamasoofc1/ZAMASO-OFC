<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZAMASO WEB</title>
  <meta name="description" content="ZAMASO official profile & biolink. Just Be Special.">
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&family=Outfit:wght@300;400;600;700;800&family=Rajdhani:wght@500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/jpeg" href="assets/zamaso_ofc.jpg">
</head>
<body>

  <!-- Custom Glowing Cursor -->
  <div class="custom-cursor" id="customCursor"></div>
  <div class="cursor-glow" id="cursorGlow"></div>

  <!-- ==================== SPLASH SCREEN (CLICK TO ENTER) ==================== -->
  <section class="splash-screen" id="splashScreen">
    <div class="ambient-glow glow-purple"></div>
    <div class="ambient-glow glow-purple2"></div>
    
    <div class="splash-content" id="splashContent">
      <!-- Glowing Avatar with Neon Ring -->
      <img src="assets/zamaso_ofc.jpg" alt="ZAMASO Avatar" id="splashAvatar" class="avatar-direct">

      <!-- Glowing Spaced Name -->
      <h1 class="splash-title" id="splashTitle">Z A M A S O</h1>

      <!-- Tagline -->
      <p class="splash-tagline" id="splashTagline">JUST BE SPECIAL</p>

      <!-- Enter Button -->
      <button class="enter-btn" id="enterBtn" aria-label="Click to enter website">
        <span class="btn-bracket">[</span>
        <span class="btn-text">CLICK TO ENTER</span>
        <span class="btn-bracket">]</span>
      </button>
    </div>
  </section>

  <!-- ==================== MAIN PROFILE EXPERIENCE ==================== -->
  <main class="main-experience hidden" id="mainExperience">
    <!-- Fullscreen Parallax Background with Video -->
    <div class="bg-container" id="bgContainer">
      <video id="bgVideo" class="bg-video" loop playsinline preload="auto">
        <source src="assets/bg_video.mp4" type="video/mp4">
      </video>
      <div class="bg-overlay"></div>
      <div class="bg-vignette"></div>
      <!-- Rising Blue Mana Embers Canvas -->
      <canvas id="particleCanvas"></canvas>
    </div>

    <!-- Top Right Music Player Widget -->
    <div class="music-player-widget" id="musicPlayerWidget">
      <div class="music-info">
        <!-- Animated Equalizer Bars -->
        <div class="equalizer-bars" id="equalizerBars">
          <span class="bar bar-1"></span>
          <span class="bar bar-2"></span>
          <span class="bar bar-3"></span>
          <span class="bar bar-4"></span>
          <span class="bar bar-5"></span>
        </div>
        <div class="track-meta">
          <div class="track-title" id="trackTitleDisplay">Solo Leveling</div>
          <div class="track-status" id="trackStatusDisplay">PLAYING</div>
        </div>
      </div>

    </div>

    <!-- Center Profile Showcase -->
    <div class="profile-card" id="profileCard">
      <!-- Profile Avatar with Blue Monarch Halo -->
      <img src="assets/zamaso_ofc.jpg" alt="ZAMASO" id="mainAvatar" class="avatar-direct">

      <!-- Social Links Bar (Directly below avatar with enlarged logos) -->
      <div class="socials-bar" id="socialsBar">
        <!-- TikTok -->
        <a href="https://www.tiktok.com/@zamaso.ofc" target="_blank" rel="noopener noreferrer" class="social-link tiktok-link" title="TikTok" aria-label="TikTok Profile" id="linkTikTok">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64c.29 0 .58.04.86.12V9.32a6.34 6.34 0 0 0-.86-.06A6.33 6.33 0 0 0 3.1 15.59a6.33 6.33 0 0 0 10.79 4.47 6.27 6.27 0 0 0 1.93-4.47V9.01a8.16 8.16 0 0 0 4.77 1.52v-3.4c-.33 0-.67-.14-1-.44z"/>
          </svg>
          <span class="tooltip">TikTok</span>
        </a>

        <!-- Instagram -->
        <a href="https://www.instagram.com/zamaso.ofc" target="_blank" rel="noopener noreferrer" class="social-link instagram-link" title="Instagram" aria-label="Instagram Profile" id="linkInstagram">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
          </svg>
          <span class="tooltip">Instagram</span>
        </a>

        <!-- Discord -->
        <a href="https://discord.com/users/1506545189882171473" target="_blank" rel="noopener noreferrer" class="social-link discord-link" title="Discord Profile" aria-label="Discord Profile" id="linkDiscord">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
            <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
          <span class="tooltip" id="discordTooltip">Discord</span>
        </a>

        <!-- YouTube -->
        <a href="https://www.youtube.com/channel/UC6rXe6eH21D7x2h0flpieaw" target="_blank" rel="noopener noreferrer" class="social-link youtube-link" title="YouTube" aria-label="YouTube Channel" id="linkYouTube">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
            <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
          </svg>
          <span class="tooltip">YouTube</span>
        </a>

        <!-- Kick (Signature Lime Green K) -->
        <a href="https://kick.com/zamasoofc1" target="_blank" rel="noopener noreferrer" class="social-link kick-link" title="Kick" aria-label="Kick Streaming" id="linkKick">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
            <!-- Precise Kick K logo -->
            <path d="M4 3h5v6.5l4.5-6.5h6l-6.5 8.5L20 21h-6.2l-4.8-7.5V21H4V3z"/>
          </svg>
          <span class="tooltip">Kick</span>
        </a>
      </div>
    </div>

    <!-- Bottom Left View Counter -->
    <div class="view-counter-badge" id="viewCounterBadge" title="Profile Views">
      <svg class="eye-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      <span class="view-count" id="viewCountText">3</span>
    </div>

    <!-- Bottom Right Controls: Netlify Badge -->
    <div class="bottom-right-actions">
      <!-- Netlify Badge matching screenshot 2 -->
      <a href="https://www.netlify.com" target="_blank" rel="noopener noreferrer" class="netlify-badge" title="Powered by Netlify">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="#00ad9e">
          <path d="M12.01 2.01C11.59 2 11.23 2.21 11 2.56L3.25 15.65c-.24.4-.23.9.02 1.3.26.4.7.65 1.18.65h5.45l-1.63 4.41c-.2.53.07 1.13.6 1.33.53.2 1.13-.07 1.33-.6l3.81-10.3c.2-.53-.07-1.13-.6-1.33-.53-.2-1.13.07-1.33.6l-.76 2.05H6.28l5.73-9.7 5.73 9.7h-1.62c-.55 0-1 .45-1 1s.45 1 1 1h2.72c.48 0 .92-.25 1.18-.65.25-.4.26-.9.02-1.3L13.02 2.56c-.23-.35-.59-.55-1.01-.55z"/>
        </svg>
        <span>Powered by <strong>Netlify</strong></span>
      </a>
    </div>
  </main>

  <!-- ==================== TOAST NOTIFICATION ==================== -->
  <div class="toast-notification" id="toastNotification">
    <span class="toast-icon">✓</span>
    <span class="toast-message" id="toastMessage">Discord tag copied!</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
